<main>
  <p>Redirecting to this person's page… If you're not redirected, <a id="fallback-link" href="people.html">browse all people</a>.</p>
</main>

<script>
  (function () {
    var params = new URLSearchParams(window.location.search);
    var id = params.get("id");
    if (id) {
      var target = "people/" + encodeURIComponent(id) + ".html";
      document.getElementById("fallback-link").href = target;
      window.location.replace(target);
    }
  })();
</script>
