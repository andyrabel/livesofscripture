<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lives of Scripture — Every Person Named in the Bible</title>
<meta name="description" content="A reference for every person named in Scripture — who they were, how they connect, and what their story reveals about God's redemptive plan.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <h1><a href="index.html">Lives of Scripture</a></h1>
    <nav>
      <a href="index.html">Browse</a>
      <a href="about.html">About</a>
    </nav>
  </div>
</header>

<main>
  <div class="controls">
    <input type="search" id="search-input" placeholder="Search by name…">
    <select id="filter-testament">
      <option value="">All testaments</option>
      <option value="OT">Old Testament</option>
      <option value="NT">New Testament</option>
    </select>
    <select id="filter-tier">
      <option value="">All entries</option>
      <option value="full">Full stories</option>
      <option value="stub">Names only</option>
    </select>
    <select id="filter-era">
      <option value="">All eras</option>
    </select>
  </div>

  <div id="result-count"></div>
  <div id="person-grid" class="person-grid"></div>
  <div id="empty-state" class="empty-state" style="display:none;">No one matches those filters.</div>
</main>

<footer class="site-footer">
  <p>Lives of Scripture — a reference for every person named in the Bible. See <a href="about.html">About</a> for sources and translation handling.</p>
</footer>

<script src="js/app.js"></script>
<script>renderIndexPage();</script>
</body>
</html>
