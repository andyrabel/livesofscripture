name: Build static pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run static site generator
        run: python3 _build/generate_static_site.py

      - name: Commit regenerated output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add people/ sitemap.xml people.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Regenerate static person pages and sitemap [skip ci]"
            git push
          fi
