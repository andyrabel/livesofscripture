name: Validate static pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run static site generator
        run: python3 _build/generate_static_site.py

      - name: Verify generated output is committed
        run: git diff --exit-code -- people/ sitemap.xml people.html
